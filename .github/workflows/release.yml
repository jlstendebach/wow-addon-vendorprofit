# Releases the addon when its version changes.
#
# On every push to main that touches the addon (or this file), this reads "## Version" from
# VendorProfit.toc. If there's no release for that version yet, it runs the
# tests, checks every file the .toc loads is there, zips the VendorProfit
# folder (unzip it into Interface\AddOns) and publishes a GitHub release
# tagged v<version>, with the commits since the last release as its notes.
# Pushes that don't bump the version release nothing.

name: Release

on:
  push:
    branches: [main]
    paths: ["VendorProfit/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^## Version:[[:space:]]*//p' VendorProfit/VendorProfit.toc | tr -d '\r[:space:]')
          if [ -z "$version" ]; then
            echo "::error file=VendorProfit/VendorProfit.toc::No '## Version:' line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::notice::v$version is already released; bump ## Version in VendorProfit.toc to release again."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.version.outputs.released == 'false'
        with:
          python-version: "3.12"

      - name: Test
        if: steps.version.outputs.released == 'false'
        run: |
          pip install lupa
          python tests/test.py

      - name: Package
        if: steps.version.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Every file the .toc loads has to be in the zip.
          missing=0
          while IFS= read -r file; do
            if [ ! -f "VendorProfit/$file" ]; then
              echo "::error file=VendorProfit/VendorProfit.toc::Loads $file, which isn't there"
              missing=1
            fi
          done < <(tr -d '\r' < VendorProfit/VendorProfit.toc | grep -v '^#' | grep -v '^[[:space:]]*$')
          [ "$missing" = 0 ]
          zip -r "VendorProfit-$VERSION.zip" VendorProfit -x '*/.*'
          unzip -l "VendorProfit-$VERSION.zip"

      - name: Release
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Notes: the commits since the last release.
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)
          if [ -n "$previous" ]; then
            echo "Changes since $previous:" > notes.md
            echo >> notes.md
            git log --no-merges --pretty='- %s' "$previous..HEAD" >> notes.md
          else
            echo "First release." > notes.md
          fi
          printf '\nUnzip into `World of Warcraft\\_forever_\\Interface\\AddOns`. Needs Auctionator. Unofficial: not made by Auctionator'"'"'s authors.\n' >> notes.md
          gh release create "v$VERSION" "VendorProfit-$VERSION.zip" \
            --title "Vendor Profit for Auctionator $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
