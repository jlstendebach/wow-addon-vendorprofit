# Checks every pull request into main: the tests pass, every commit is a
# Conventional Commit (the release version is worked out from them), and the
# .toc still says @project-version@ (the release stamps the real one).
#
# "Tests and commits" is a required status check in main's ruleset, so a
# pull request can't merge until this passes.

name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests and commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install lupa
          python tests/test.py

      - name: Commit messages
        # The checkout is the pull request merged into main: its first parent
        # is main, its second the pull request's branch.
        run: bash scripts/check-commits.sh HEAD^1 HEAD^2

      - name: Version placeholder
        run: |
          if ! grep -q '^## Version: @project-version@' VendorProfit/VendorProfit.toc; then
            echo "::error file=VendorProfit/VendorProfit.toc::The version is set when releasing; keep '## Version: @project-version@'."
            exit 1
          fi

      - name: Next release
        run: |
          read -r version last < <(bash scripts/next-version.sh) || true
          if [ -n "${version:-}" ]; then
            echo "::notice::Merging this releases $version (last release: $last)."
          else
            echo "::notice::Merging this releases nothing: the addon didn't change."
          fi
