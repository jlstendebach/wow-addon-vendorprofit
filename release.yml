# Releases the addon when changes to it reach main.
#
# The version isn't in the repository (VendorProfit.toc says
# @project-version@); it's worked out from the commits since the last release
# (scripts/next-version.sh): any feat is a minor release, anything else that
# changed the addon a patch, and feat! or BREAKING CHANGE a major one. Merges
# that don't touch the addon release nothing.
#
# It runs the tests, stamps the version into the .toc inside the zip, checks
# every file the .toc loads is there, and publishes a GitHub release tagged
# v<version>, with the commits since the last release as its notes.

name: Release

on:
  push:
    branches: [main]
    paths: ["VendorProfit/**", ".github/workflows/release.yml", "scripts/next-version.sh"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two quick merges can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          git fetch --tags --force
          read -r version last < <(bash scripts/next-version.sh) || true
          if [ -z "${version:-}" ]; then
            echo "::notice::Nothing in the addon changed since the last release; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released."
            exit 1
          fi
          echo "Releasing $version (last release: $last)"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.version.outputs.release == 'true'
        with:
          python-version: "3.12"

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: |
          pip install lupa
          python tests/test.py

      - name: Package
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^## Version:.*/## Version: $VERSION/" VendorProfit/VendorProfit.toc
          grep "^## Version: $VERSION" VendorProfit/VendorProfit.toc
          # Every file the .toc loads has to be in the zip.
          missing=0
          while IFS= read -r file; do
            if [ ! -f "VendorProfit/$file" ]; then
              echo "::error file=VendorProfit/VendorProfit.toc::Loads $file, which isn't there"
              missing=1
            fi
          done < <(tr -d '\r' < VendorProfit/VendorProfit.toc | grep -v '^#' | grep -v '^[[:space:]]*$')
          [ "$missing" = 0 ]
          zip -r "VendorProfit-$VERSION.zip" VendorProfit -x '*/.*'
          unzip -l "VendorProfit-$VERSION.zip"

      - name: Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          # Notes: the commits since the last release.
          if [ "$LAST" != "none" ]; then
            echo "Changes since $LAST:" > notes.md
            echo >> notes.md
            git log --no-merges --pretty='- %s' "$LAST..HEAD" >> notes.md
          else
            echo "First release." > notes.md
          fi
          printf '\nUnzip into `World of Warcraft\\_forever_\\Interface\\AddOns`. Needs Auctionator. Unofficial: not made by Auctionator'"'"'s authors.\n' >> notes.md
          gh release create "v$VERSION" "VendorProfit-$VERSION.zip" \
            --title "Vendor Profit for Auctionator $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
